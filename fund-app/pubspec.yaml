name: fund_app
description: FundFlow mobile app — blockchain crowdfunding powered by fund-server.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - .env.production
